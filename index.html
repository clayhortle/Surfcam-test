<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SurfCam · Bombo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:     #05101f;
  --deep:    #091628;
  --panel:   #0d2040;
  --rim:     rgba(255,255,255,0.07);
  --text:    #cdddf0;
  --dim:     #5a7a9a;
  --wave:    #00d4aa;
  --waveglow:#00d4aa44;
  --danger:  #ff4f4f;
  --amber:   #f5a623;
  --white:   #ffffff;
  --mono:    'SF Mono','Fira Code',monospace;
  --sans:    -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

html { height: 100%; }

body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100%;
  overflow-x: hidden;
}

.hero-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(0,180,140,0.13) 0%, transparent 70%),
    radial-gradient(ellipse 60% 60% at 80% 80%, rgba(0,60,120,0.18) 0%, transparent 70%),
    var(--ink);
  pointer-events: none;
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  padding: 0 0 4rem;
}

/* Header */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.1rem 1.1rem 0;
  margin-bottom: 1.1rem;
}

.logo { display: flex; align-items: center; gap: 0.5rem; }
.logo-wave { width: 28px; height: 28px; }

.logo-text {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--white);
}
.logo-text em { color: var(--wave); font-style: normal; }

.live-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 5px 11px;
  border-radius: 100px;
  background: rgba(0,212,170,0.1);
  border: 1px solid rgba(0,212,170,0.25);
  color: var(--wave);
  transition: all 0.3s;
}
.live-pill.offline { background: rgba(255,79,79,0.1); border-color: rgba(255,79,79,0.25); color: var(--danger); }
.live-pill.loading { background: rgba(245,166,35,0.1); border-color: rgba(245,166,35,0.25); color: var(--amber); }

.pip { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.live-pill:not(.offline):not(.loading) .pip { animation: livepulse 1.6s ease-in-out infinite; }

@keyframes livepulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.3; transform: scale(0.8); }
}

/* Break name */
.break-header { padding: 0 1.1rem 0.9rem; }

.break-name {
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--white);
  line-height: 1;
}

.break-sub {
  font-size: 0.78rem;
  color: var(--dim);
  margin-top: 0.3rem;
  font-family: var(--mono);
  letter-spacing: 0.04em;
}

/* Video */
.video-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  overflow: hidden;
}

video { width: 100%; height: 100%; display: block; object-fit: cover; }

.video-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(5,16,31,0.35) 0%, transparent 30%, transparent 65%, rgba(5,16,31,0.75) 100%);
  pointer-events: none;
}

.vid-stamp {
  position: absolute;
  bottom: 0.9rem;
  left: 1rem;
  z-index: 2;
  font-family: var(--mono);
  font-size: 0.7rem;
  color: rgba(255,255,255,0.6);
  letter-spacing: 0.05em;
  display: none;
}
.vid-stamp.on { display: block; }

.vid-tag {
  position: absolute;
  top: 0.75rem;
  left: 0.85rem;
  z-index: 2;
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  display: none;
}
.vid-tag.on { display: block; }

.vid-overlay {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.65rem;
  background: rgba(5,16,31,0.88);
  backdrop-filter: blur(4px);
  transition: opacity 0.4s, visibility 0.4s;
}
.vid-overlay.gone { opacity: 0; visibility: hidden; }

.idle-icon {
  font-size: 2.8rem;
  animation: float 3s ease-in-out infinite;
  line-height: 1;
}

@keyframes float {
  0%,100% { transform: translateY(0) rotate(-2deg); }
  50%      { transform: translateY(-8px) rotate(2deg); }
}

.idle-label { font-size: 0.8rem; color: var(--dim); text-align: center; max-width: 180px; line-height: 1.5; }

.choose-btn {
  margin-top: 0.25rem;
  background: var(--wave);
  color: var(--ink);
  font-weight: 700;
  font-size: 0.8rem;
  padding: 9px 22px;
  border-radius: 100px;
  cursor: pointer;
  border: none;
  display: inline-block;
  transition: transform 0.1s, opacity 0.15s;
}
.choose-btn:active { transform: scale(0.95); opacity: 0.85; }
#fileInput { display: none; }

/* Conditions */
.conditions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--rim);
  border-top: 1px solid var(--rim);
  border-bottom: 1px solid var(--rim);
  margin-bottom: 1.25rem;
}

.cond { background: var(--deep); padding: 0.75rem 0.5rem; text-align: center; }

.cond-val {
  font-family: var(--mono);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--white);
  line-height: 1;
  margin-bottom: 0.2rem;
}
.cond-val.lit { color: var(--wave); }

.cond-label {
  font-family: var(--mono);
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--dim);
}

/* Input */
.section { padding: 0 1.1rem; margin-bottom: 1.5rem; }

.eyebrow {
  font-family: var(--mono);
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--dim);
  margin-bottom: 0.6rem;
}

.input-row { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }

input[type="text"] {
  flex: 1;
  min-width: 0;
  background: var(--panel);
  border: 1px solid var(--rim);
  border-radius: 10px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 0.75rem;
  padding: 0.7rem 0.9rem;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  -webkit-appearance: none;
}
input[type="text"]:focus { border-color: rgba(0,212,170,0.5); box-shadow: 0 0 0 3px var(--waveglow); }
input[type="text"]::placeholder { color: var(--dim); }

.btn-load {
  background: var(--wave);
  color: var(--ink);
  border: none;
  border-radius: 10px;
  font-weight: 800;
  font-size: 0.8rem;
  padding: 0 1.2rem;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: opacity 0.15s, transform 0.1s;
}
.btn-load:active { transform: scale(0.95); opacity: 0.85; }

.btn-stop {
  background: transparent;
  color: var(--danger);
  border: 1px solid rgba(255,79,79,0.3);
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 600;
  padding: 0 0.9rem;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
.btn-stop:active { background: rgba(255,79,79,0.1); }

.presets { display: flex; gap: 0.4rem; flex-wrap: wrap; }

.preset {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--dim);
  background: var(--panel);
  border: 1px solid var(--rim);
  border-radius: 100px;
  padding: 5px 12px;
  cursor: pointer;
  font-weight: 500;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
.preset:active { color: var(--wave); border-color: rgba(0,212,170,0.4); }

/* Rule */
.rule { height: 1px; background: var(--rim); margin: 0 1.1rem 1.5rem; }

/* Log */
.log-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }

.log-eyebrow {
  font-family: var(--mono);
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--dim);
}

.btn-clr { font-family: var(--mono); font-size: 0.62rem; color: var(--dim); background: none; border: none; cursor: pointer; }

.log-box {
  background: var(--panel);
  border: 1px solid var(--rim);
  border-radius: 10px;
  padding: 0.7rem 0.85rem;
  max-height: 160px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--rim) transparent;
}

.log-row { display: flex; gap: 0.6rem; font-family: var(--mono); font-size: 0.7rem; line-height: 1.8; }
.lt  { color: var(--dim); flex-shrink: 0; }
.lok { color: var(--wave); }
.lerr{ color: var(--danger); }
.linf{ color: var(--text); }

.log-mt { font-family: var(--mono); font-size: 0.7rem; color: var(--dim); text-align: center; padding: 0.75rem 0; }

/* Cards */
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 1.25rem; }

.card { background: var(--panel); border: 1px solid var(--rim); border-radius: 10px; padding: 0.8rem 0.9rem; }

.card-lbl {
  font-family: var(--mono);
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--dim);
  margin-bottom: 0.3rem;
}

.card-val { font-family: var(--mono); font-size: 0.82rem; color: var(--dim); word-break: break-all; }
.card-val.lit  { color: var(--white); }
.card-val.good { color: var(--wave); }

/* Footer */
.foot {
  margin-top: 2.5rem;
  padding: 0 1.1rem;
  text-align: center;
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--dim);
  letter-spacing: 0.06em;
}
</style>
</head>
<body>

<div class="hero-bg"></div>
<div class="wrap">

  <div class="top-bar">
    <div class="logo">
      <svg class="logo-wave" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 18c2-4 4-6 7-6s5 4 7 4 4-3 6-6" stroke="#00d4aa" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M2 22c2-3 4-5 7-5s5 4 7 4 4-2 6-5" stroke="#00d4aa" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
      </svg>
      <span class="logo-text">SURF<em>CAM</em></span>
    </div>
    <div class="live-pill offline" id="livePill">
      <span class="pip"></span>
      <span id="pillLbl">No stream</span>
    </div>
  </div>

  <div class="break-header">
    <div class="break-name">Bombo</div>
    <div class="break-sub">Kiama · NSW · Team test build</div>
  </div>

  <div class="video-wrap" id="vWrap">
    <video id="video" controls playsinline></video>
    <div class="vid-tag" id="vidTag">Bombo · Kiama</div>
    <div class="vid-stamp" id="vidStamp"></div>
    <div class="vid-overlay" id="vidOverlay">
      <div class="idle-icon">🌊</div>
      <div class="idle-label">No stream loaded — paste an HLS URL or pick a local video</div>
      <label class="choose-btn">
        Choose video
        <input type="file" id="fileInput" accept="video/*">
      </label>
    </div>
  </div>

  <div class="conditions">
    <div class="cond"><div class="cond-val" id="cWind">—</div><div class="cond-label">Wind</div></div>
    <div class="cond"><div class="cond-val" id="cSwell">—</div><div class="cond-label">Swell</div></div>
    <div class="cond"><div class="cond-val" id="cTide">—</div><div class="cond-label">Tide</div></div>
    <div class="cond"><div class="cond-val" id="cQual">—</div><div class="cond-label">Rating</div></div>
  </div>

  <div class="section">
    <div class="eyebrow">Stream source</div>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="Paste HLS (.m3u8) or MP4 URL…"
        autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"/>
      <button class="btn-load" onclick="loadStream()">Load</button>
      <button class="btn-stop" onclick="stopStream()">✕</button>
    </div>
    <div class="presets">
      <span style="font-size:0.62rem;color:var(--dim);align-self:center;font-family:var(--mono)">Try:</span>
      <button class="preset" onclick="loadPreset('mp4')">Sample MP4</button>
      <button class="preset" onclick="loadPreset('hls')">Sample HLS</button>
      <button class="preset" onclick="loadPreset('cond')">Fake conditions</button>
      <button class="preset" onclick="loadPreset('clear')">Clear</button>
    </div>
  </div>

  <div class="rule"></div>

  <div class="section">
    <div class="log-head">
      <div class="log-eyebrow">Test log</div>
      <button class="btn-clr" onclick="clearLog()">Clear</button>
    </div>
    <div class="log-box" id="logBox">
      <div class="log-mt" id="logMt">No events yet</div>
    </div>
    <div class="cards">
      <div class="card"><div class="card-lbl">Type</div><div class="card-val" id="iType">—</div></div>
      <div class="card"><div class="card-lbl">Loaded</div><div class="card-val" id="iTime">—</div></div>
      <div class="card"><div class="card-lbl">Resolution</div><div class="card-val" id="iRes">—</div></div>
      <div class="card"><div class="card-lbl">HLS.js</div><div class="card-val good" id="iHls">—</div></div>
    </div>
  </div>

  <div class="foot">SURFCAM · TEAM TEST · NOT FOR PUBLIC DISTRIBUTION</div>
</div>

<script>
const video    = document.getElementById('video');
const overlay  = document.getElementById('vidOverlay');
const pill     = document.getElementById('livePill');
const pillLbl  = document.getElementById('pillLbl');
const urlInput = document.getElementById('urlInput');
const logBox   = document.getElementById('logBox');
const logMt    = document.getElementById('logMt');
const vidStamp = document.getElementById('vidStamp');
const vidTag   = document.getElementById('vidTag');

let hls = null, stampInterval = null;

function setPill(state, label) {
  pill.className = 'live-pill' + (state !== 'live' ? ' ' + state : '');
  pillLbl.textContent = label;
}

function startStamp() {
  vidStamp.classList.add('on');
  vidTag.classList.add('on');
  const tick = () => {
    vidStamp.textContent = new Date().toLocaleTimeString('en-AU', {
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false, timeZone: 'Australia/Sydney'
    });
  };
  tick();
  stampInterval = setInterval(tick, 1000);
}

function stopStamp() {
  clearInterval(stampInterval);
  vidStamp.classList.remove('on');
  vidTag.classList.remove('on');
}

function log(msg, type = 'inf') {
  if (logMt) logMt.style.display = 'none';
  const t = new Date().toLocaleTimeString('en-AU', { hour12: false });
  const r = document.createElement('div');
  r.className = 'log-row';
  r.innerHTML = `<span class="lt">${t}</span><span class="l${type}">${msg}</span>`;
  logBox.appendChild(r);
  logBox.scrollTop = logBox.scrollHeight;
}

function clearLog() {
  logBox.innerHTML = '<div class="log-mt" id="logMt">No events yet</div>';
}

function setCard(id, val, cls) {
  const el = document.getElementById(id);
  el.textContent = val;
  el.className = 'card-val' + (cls ? ' ' + cls : '');
}

function resetCards() {
  ['iType','iTime','iRes'].forEach(id => setCard(id, '—'));
}

function setCond(wind, swell, tide, qual, on) {
  const c = on ? 'cond-val lit' : 'cond-val';
  ['cWind','cSwell','cTide','cQual'].forEach((id, i) => {
    const el = document.getElementById(id);
    el.textContent = [wind, swell, tide, qual][i];
    el.className = c;
  });
}

function stopStream() {
  if (hls) { hls.destroy(); hls = null; }
  video.pause();
  video.removeAttribute('src');
  video.load();
  overlay.classList.remove('gone');
  setPill('offline', 'No stream');
  stopStamp();
  log('Stream stopped');
  resetCards();
}

const PRESETS = {
  mp4: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
  hls: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',
};

function loadPreset(key) {
  if (key === 'clear') { stopStream(); urlInput.value = ''; return; }
  if (key === 'cond') {
    setCond('12 kts', '1.4m', '+0.3', '★★★☆', true);
    log('Fake conditions applied (placeholder)', 'inf');
    return;
  }
  urlInput.value = PRESETS[key];
  loadStream();
}

function loadStream() {
  const url = urlInput.value.trim();
  if (!url) { log('No URL entered', 'err'); return; }
  stopStream();
  setPill('loading', 'Connecting…');
  log(`Loading: ${url.length > 55 ? url.slice(0,52)+'…' : url}`);

  const isHLS = url.includes('.m3u8');
  setCard('iType', isHLS ? 'HLS (.m3u8)' : 'MP4 / direct', 'lit');

  if (isHLS && Hls.isSupported()) {
    hls = new Hls({ debug: false });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { log('HLS manifest parsed ✓', 'ok'); play('HLS'); });
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (d.fatal) { log(`HLS error: ${d.details}`, 'err'); setPill('offline', 'Error'); }
    });
  } else if (isHLS && video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    log('Native HLS (Safari) ✓', 'ok');
    play('HLS native');
  } else {
    video.src = url;
    log('Loading as direct video…');
    play('MP4');
  }
}

function play(label) {
  overlay.classList.add('gone');
  video.play().then(() => {
    setPill('live', 'Live');
    log(`Playing: ${label} ✓`, 'ok');
    setCard('iTime', new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' }), 'lit');
    startStamp();
  }).catch(() => {
    setPill('loading', 'Tap ▶');
    log('Autoplay blocked — tap ▶ on the video');
  });
}

document.getElementById('fileInput').addEventListener('change', function () {
  const f = this.files[0];
  if (!f) return;
  stopStream();
  video.src = URL.createObjectURL(f);
  setCard('iType', `Local ${f.name.split('.').pop().toUpperCase()}`, 'lit');
  log(`Local file: ${f.name} (${(f.size/1024/1024).toFixed(1)} MB)`);
  play('Local file');
});

video.addEventListener('waiting',  () => setPill('loading', 'Buffering…'));
video.addEventListener('playing',  () => { setPill('live', 'Live'); startStamp(); });

video.addEventListener('loadedmetadata', () => {
  const w = video.videoWidth, h = video.videoHeight;
  if (w && h) { setCard('iRes', `${w}×${h}`, 'lit'); log(`Resolution: ${w}×${h}`, 'ok'); }
});

video.addEventListener('error', () => {
  const m = {1:'Aborted',2:'Network error',3:'Decode error',4:'Format not supported'};
  const msg = m[video.error?.code] || 'Unknown error';
  log(`Video error: ${msg}`, 'err');
  setPill('offline', 'Error');
  overlay.classList.remove('gone');
  stopStamp();
});

urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadStream(); });

document.getElementById('iHls').textContent = `v${Hls.version}`;
setPill('offline', 'No stream');
</script>
</body>
</html>
